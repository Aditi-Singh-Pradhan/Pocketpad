<!DOCTYPE html>
<html>

<body style="margin:0; overflow:hidden;">
<canvas id="c"></canvas>

<script>

const ws = new WebSocket(`ws://${window.location.hostname}:8765`);

ws.onopen = () => console.log("Connected to server");
ws.onerror = e => console.log("WS error", e);

const canvas = document.getElementById("c");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

canvas.style.touchAction = "none";

let state = "idle";                 // "idle", "waiting", "moving"
let startX = null;
let startY = null;
let lastX = null;
let lastY = null;
let scrollLastY = null;

canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();

    if (e.touches.length > 1) {
        // Handle scroll with two fingers
        state = "scrolling";
        scrollLastY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        return;
    }

    const touch = e.touches[0];
    startX = touch.clientX;
    startY = touch.clientY;

    state = "waiting";          // Wait to see if it's a click or move

});

canvas.addEventListener("touchmove", (e) => {
    e.preventDefault();

    const touch = e.touches[0];
    const currentX = touch.clientX;
    const currentY = touch.clientY;
    
    if (state === "scrolling") {
        const currentScrollY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        const scrollDeltaY = (currentScrollY - scrollLastY)*0.1;

        ws.send(JSON.stringify({ type: "scroll", scroll_y: -scrollDeltaY }));

        scrollLastY = currentScrollY;
        return;
    }
    
    if (state === "waiting") {
        if (Math.hypot(currentX - startX, currentY - startY) > 5) {
            state = "moving";
            lastX = startX;   // not current X or Y to avoid jump
            lastY = startY;
        }
    }

    if (state === "moving") {
        const dx = currentX - lastX;
        const dy = currentY - lastY;

        ws.send(JSON.stringify({ type: "move", dx, dy }));

        lastX = currentX;
        lastY = currentY;
    }
});

canvas.addEventListener("touchend",(e) => {
    e.preventDefault();

    if (state === "waiting") {
        ws.send(JSON.stringify({ type: "click", button: "left" }));
    }
    state = "idle";
    startX = null;
    startY = null;

    lastX = null;
    lastY = null;
    scrollLastY = null;
});

</script>
</body>
</html>
